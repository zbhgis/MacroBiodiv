# ─────────────────────────────────────────────────────────────
# MacroBiodiv 文献库 · 子域 macrobiodiv.zbhgis.com
# 用法：复制到服务器 /etc/nginx/conf.d/macrobiodiv.conf
# 证书路径与主站 acme.sh 的安装位置一致（/etc/nginx/ssl/）
# ─────────────────────────────────────────────────────────────

# ─── HTTP：acme.sh 验证 + 跳转 HTTPS ───
server {
    listen 80;
    server_name macrobiodiv.zbhgis.com;

    # acme.sh 验证专用路径（webroot 模式）
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme/macrobiodiv; }

    location / { return 301 https://$host$request_uri; }
}

# ─── HTTPS：静态文献库 + 统计 API 反代 ───
server {
    # http2：papers-data.js 等大体量资源与页面同源并行加载，不再 HTTP/1.1 排队
    # （listen 级写法兼容 1.9.5+ 全版本；nginx ≥1.25.1 提示改用 http2 on，等价）
    listen 443 ssl http2;
    server_name macrobiodiv.zbhgis.com;

    # 证书路径（与 acme.sh --install-cert 的安装位置一致，见操作手册）
    ssl_certificate     /etc/nginx/ssl/macrobiodiv.zbhgis.com.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/macrobiodiv.zbhgis.com.key;

    root /var/www/macrobiodiv;
    index index.html;

    # 与 GeoSciPlot 同规格：HTML 有 <meta charset>，但响应头缺 charset 时
    # 部分抓取端会按默认编码解码，中文元数据变乱码。
    charset utf-8;

    # 统计 API：反代到 FastAPI（浏览器视角同源，文献库零 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS 定制订阅（/rss/ 配置页为静态，feed 由 FastAPI 按 query 参数实时过滤
    # feed-pool.json 生成——发布整体上传池文件，后端零状态）
    location = /rss/feed.atom {
        proxy_pass http://127.0.0.1:8000/api/v1/mbd/feed.atom;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 静态站兜底（详情页 /{id}/ 直达时落到自己的 index.html）。
    # HTML 与根目录文本（llms*.txt / sitemap / atom.xml）：发布后立即可见，
    # 允许 304 协商缓存（nginx 静态文件自带 Last-Modified，代价是一次往返）。
    # location 内 add_header 会覆盖继承，安全头需重复声明
    error_page 404 /404.html;
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    # 静态资源：?v= 已改为按文件内容 hash（asset_ver），内容一变 URL 必变
    # → 放心 immutable 年缓存，没改的文件跨发布继续命中（此前每次发布全站缓存失效）
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    # 构建期为文本产物预生成了 .gz（assets/*.js|css、llms*.txt、sitemap.xml、
    # atom.xml），gzip_static 命中则零 CPU 直出——低带宽云盘上省下动态压缩开销
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/html 默认强制压缩；这里补纯文本入口：本站 llms-full.txt 实测 1.4MB，
    # 不压缩等于每次 AI 爬虫抓取都传整份全文（服务器是低带宽云盘，代价明显）。
    # text/javascript：nginx ≥1.27 起 .js 默认 MIME 从 application/javascript
    # 改为 text/javascript，不列的话届时 .js 将完全不压缩（papers-data.js 最该压）
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml text/plain text/xml application/xml application/atom+xml;
}
