# ─────────────────────────────────────────────────────────────
# MacroBiodiv 文献库 · 子域 macrobiodiv.zbhgis.com
# 用法：复制到服务器 /etc/nginx/conf.d/macrobiodiv.conf
# 证书路径与主站 acme.sh 的安装位置一致（/etc/nginx/ssl/）
# ─────────────────────────────────────────────────────────────

# ─── HTTP：acme.sh 验证 + 跳转 HTTPS ───
server {
    listen 80;
    server_name macrobiodiv.zbhgis.com;

    # acme.sh 验证专用路径（webroot 模式）
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme/macrobiodiv; }

    location / { return 301 https://$host$request_uri; }
}

# ─── HTTPS：静态文献库 + 统计 API 反代 ───
server {
    listen 443 ssl;
    server_name macrobiodiv.zbhgis.com;

    # 证书路径（与 acme.sh --install-cert 的安装位置一致，见操作手册）
    ssl_certificate     /etc/nginx/ssl/macrobiodiv.zbhgis.com.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/macrobiodiv.zbhgis.com.key;

    root /var/www/macrobiodiv;
    index index.html;

    # 统计 API：反代到 FastAPI（浏览器视角同源，文献库零 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态站兜底（详情页 /{id}/ 直达时落到自己的 index.html）
    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
